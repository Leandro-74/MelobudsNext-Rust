[package]
name = "melobudsnext"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
default-run = "melobudsnext"
description = "Cross-platform control tool for the QCY Melobuds Pro BLE protocol"
license = "MIT"

[features]
default = ["gui"]
gui = ["dep:iced"]

[dependencies]
anyhow = "1"
btleplug = "0.13.5"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
iced = { version = "0.13.1", optional = true, default-features = false, features = ["tokio", "tiny-skia", "fira-sans", "svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
uuid = "1"

# Embeds the icon in the Windows executables (see build.rs). Required on the
# host for cross builds, so it is not target-gated.
[build-dependencies]
winresource = { version = "0.1", default-features = false }

[[bin]]
name = "melobudsnext-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[profile.release]
lto = "thin"
strip = true
