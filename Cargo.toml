[package]
name = "melobudsnext"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Cross-platform control tool for the QCY Melobuds Pro BLE protocol"
license = "MIT"

[dependencies]
anyhow = "1"
btleplug = "0.13.5"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
uuid = "1"

[profile.release]
lto = "thin"
strip = true
