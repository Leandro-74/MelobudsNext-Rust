[package]
name = "melobudsnext"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
default-run = "melobudsnext"
description = "Cross-platform control tool for the QCY Melobuds Pro BLE protocol"
license = "MIT"

[dependencies]
anyhow = "1"
btleplug = "0.13.5"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
iced = { version = "0.13.1", default-features = false, features = ["tokio", "tiny-skia", "fira-sans", "svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
uuid = "1"

[[bin]]
name = "melobudsnext-gui"
path = "src/bin/gui.rs"

[profile.release]
lto = "thin"
strip = true
