[package]
name = "melobudsnext"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Cross-platform control tool for the QCY Melobuds Pro BLE protocol"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
strip = true
